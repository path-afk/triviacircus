<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Trivia Circus — Owner</title><style>
:root{--navy:#071c3d;--blue:#0b4b8f;--gold:#f5bd32;--cream:#f7f4ec;--white:#fff;--ink:#11213a;--muted:#6f7b8e;--green:#20b486;--red:#e45b5b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,var(--navy),var(--blue));color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;min-height:100vh}.top{height:72px;padding:0 max(22px,env(safe-area-inset-right)) 0 max(22px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;color:white;border-bottom:1px solid #ffffff20}.brand{display:flex;gap:12px;align-items:center;font-weight:900;font-size:20px}.mark{width:42px;height:42px;border-radius:13px;background:var(--gold);display:grid;place-items:center}.actions{display:flex;gap:10px;align-items:center}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:#ffffff18;color:white}.wrap{max-width:1400px;margin:auto;padding:24px}.hero{display:flex;align-items:end;justify-content:space-between;color:white;margin-bottom:20px}.hero h1{margin:0;font-size:clamp(26px,4vw,42px)}.hero p{margin:5px 0 0;color:#dce8fa}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card{background:var(--white);border-radius:18px;padding:18px;box-shadow:0 14px 35px #00122a35}.metric b{display:block;font-size:30px;color:var(--navy)}.metric span{color:var(--muted);font-weight:700}.wide{grid-column:span 3}.side{grid-column:span 2}.card h2{font-size:17px;margin:0 0 14px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #e7ebf1}th{font-size:12px;text-transform:uppercase;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:#aab3c1}.dot.on{background:var(--green);box-shadow:0 0 0 4px #20b48622}.feed{display:grid;gap:9px;max-height:430px;overflow:auto}.event{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e7ebf1}.event small{color:var(--muted)}.empty{color:var(--muted);padding:24px 0}.error{color:#ffd7d7}.pill{background:#e9f1fb;border-radius:99px;padding:4px 8px;font-size:12px;font-weight:800}@media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}.metric{grid-column:span 1}.wide,.side{grid-column:1/-1}}@media(max-width:560px){.top{height:64px}.wrap{padding:16px}.grid{grid-template-columns:1fr}.metric{grid-column:auto}.hero{align-items:start;gap:12px}.card{padding:15px;border-radius:15px}.brand span:last-child{display:none}}
</style></head><body><header class="top"><div class="brand"><span class="mark">🎪</span><span>Trivia Circus Owner</span></div><div class="actions"><span class="pill" id="stamp">Loading</span><button class="btn" id="refresh">Refresh</button></div></header><main class="wrap"><section class="hero"><div><h1>Circus intelligence</h1><p>Private account, gameplay, and engagement analytics.</p></div></section><section class="grid" id="metrics"></section><section class="grid" style="margin-top:14px"><article class="card wide"><h2>Registered players</h2><div class="scroll"><table><thead><tr><th>Player</th><th>Status</th><th>Score</th><th>Accuracy</th><th>Avg answer</th><th>Fastest</th><th>Last login</th></tr></thead><tbody id="users"></tbody></table></div></article><article class="card side"><h2>Recent activity</h2><div class="feed" id="activity"></div></article><article class="card wide"><h2>Category performance</h2><div class="scroll"><table><thead><tr><th>Category</th><th>Answers</th><th>Accuracy</th><th>Avg answer</th></tr></thead><tbody id="categories"></tbody></table></div></article></section></main><script>
const $=id=>document.getElementById(id),fmtMs=n=>n==null?'—':(n/1000).toFixed(2)+'s',fmtDate=n=>n?new Date(n*1000).toLocaleString():'—',pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
function esc(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}
async function load(){try{const r=await fetch('/api/owner/analytics',{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw new Error(r.status===404?'Owner access unavailable':'Could not load analytics');const d=await r.json(),t=d.totals;const metrics=[['Online now',t.onlineUsers],['Registered',t.registeredUsers],['Answers',t.answers],['Accuracy',pct(t.correctAnswers,t.answers)],['Avg answer',fmtMs(t.avgAnswerMs)]];$('metrics').innerHTML=metrics.map(x=>'<article class="card metric"><b>'+esc(x[1])+'</b><span>'+esc(x[0])+'</span></article>').join('');$('users').innerHTML=d.users.length?d.users.map(u=>'<tr><td><strong>'+esc(u.username)+'</strong></td><td><span class="dot '+(u.online?'on':'')+'"></span>'+(u.online?'Online':'Offline')+'</td><td>'+u.score+'</td><td>'+pct(u.correct,u.answers)+'</td><td>'+fmtMs(u.avgAnswerMs)+'</td><td>'+fmtMs(u.fastestCorrectMs)+'</td><td>'+fmtDate(u.lastLoginAt)+'</td></tr>').join(''):'<tr><td colspan="7" class="empty">No registered players yet.</td></tr>';$('activity').innerHTML=d.activity.length?d.activity.map(a=>'<div class="event"><span><strong>'+esc(a.username)+'</strong> '+esc(a.event)+'</span><small>'+fmtDate(a.createdAt)+'</small></div>').join(''):'<div class="empty">No activity yet.</div>';$('categories').innerHTML=d.categories.length?d.categories.map(c=>'<tr><td>'+esc(c.category)+'</td><td>'+c.answers+'</td><td>'+pct(c.correct,c.answers)+'</td><td>'+fmtMs(c.avgAnswerMs)+'</td></tr>').join(''):'<tr><td colspan="4" class="empty">New answer timing will appear here.</td></tr>';$('stamp').textContent='Updated '+new Date().toLocaleTimeString()}catch(e){$('metrics').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
$('refresh').onclick=load;load();setInterval(load,30000);
</script></body></html>
