<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trivia Circus Live</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  color-scheme:light;
  --page:#f7f4ee;--surface:#ffffff;--text:#16202a;--text-muted:#4b5a67;
  --border:#6b7782;--border-soft:#d8d4cc;
  --coral:#c92f3f;--coral-hover:#a82334;--teal:#007f6d;--teal-hover:#006b5d;
  --amber:#b07800;--focus:#006b5d;--shadow:0 8px 24px rgb(22 32 42/10%);
}
body{background:var(--page);color:var(--text);font-family:system-ui,-apple-system,Inter,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1.25rem;background:var(--surface);border-bottom:1px solid var(--border-soft);flex-shrink:0;gap:.75rem;box-shadow:0 1px 4px rgb(22 32 42/8%)}
.logo{font-size:.9rem;font-weight:900;color:var(--coral)}.logo em{color:var(--text);font-style:normal}
.qctr{font-size:.72rem;color:var(--text-muted);font-weight:600}
.myscore{font-size:.82rem;font-weight:800;color:var(--teal)}
.layout{display:flex;flex:1;overflow:hidden;min-height:0}
.side{width:190px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;overflow:hidden}
.side-head{padding:.7rem .9rem;font-size:.65rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border-soft);flex-shrink:0}
.plist{overflow-y:auto;flex:1}
.prow{display:flex;align-items:center;gap:.45rem;padding:.45rem .75rem;border-bottom:1px solid var(--border-soft)}
.prow.me{background:rgba(0,127,109,.06)}
.pav{width:1.6rem;height:1.6rem;border-radius:50%;background:#f0f4f8;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--coral);font-size:.72rem;flex-shrink:0;border:1.5px solid var(--border-soft)}
.pinfo{flex:1;min-width:0}
.pname{font-size:.72rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.pscore{font-size:.65rem;color:var(--teal);font-weight:700}
.pdot{width:5px;height:5px;border-radius:50%;flex-shrink:0;background:var(--border-soft)}
.pdot.on{background:var(--coral)}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.75rem;overflow:hidden;min-width:0}
.announce{background:#fff8e1;border:1px solid #f0c030;border-radius:8px;padding:.55rem 1rem;color:var(--amber);font-size:.82rem;font-weight:700;text-align:center;margin-bottom:.85rem;display:none;width:100%;max-width:660px}
.announce.show{display:block}
.panel{width:100%;max-width:660px}
#idle{text-align:center;padding:2rem}
.big-e{font-size:4rem;margin-bottom:1rem}
#idle h2{font-size:1.5rem;font-weight:900;margin-bottom:.5rem}
#idle p{color:var(--dim);font-size:.9rem}
#question{display:none;background:var(--surface);color:var(--text);border-radius:14px;padding:1.5rem 1.75rem;box-shadow:var(--shadow);border:1px solid var(--border-soft)}
.qmeta{display:flex;align-items:center;gap:.85rem;margin-bottom:1.1rem}
.qcat{background:rgba(15,28,46,.08);color:#4a6070;font-size:.7rem;font-weight:800;padding:.18rem .65rem;border-radius:999px}
.twrap{margin-left:auto;position:relative;width:44px;height:44px;flex-shrink:0}
.twrap svg{transform:rotate(-90deg)}
.tnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.88rem;font-weight:800;color:#1a2a3a}
.qtext{font-size:1.15rem;font-weight:700;line-height:1.5;margin-bottom:1.4rem;color:#0f1c2e}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
.opt{background:var(--surface);border:2px solid var(--border-soft);border-radius:10px;padding:.85rem 1rem;cursor:pointer;display:flex;align-items:center;gap:.55rem;text-align:left;color:var(--text);font-family:inherit;font-size:.88rem;font-weight:600;transition:border-color .15s,background .15s;width:100%;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--coral);background:#fff5f5}
.opt:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.opt:disabled{cursor:default;opacity:.85}
.opt.sel{border-color:var(--coral);background:#fff0f0}
.opt.ok{border-color:var(--teal)!important;background:rgba(0,201,167,.08)!important;color:#0a6b5a}
.opt.bad{border-color:var(--coral)!important;background:rgba(255,82,82,.06)!important}
.okey{width:1.85rem;height:1.85rem;border-radius:6px;background:rgba(15,28,46,.08);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:900;color:#4a6070;flex-shrink:0}
.opt.sel .okey,.opt.ok .okey{background:var(--coral);color:#fff}
.opt.ok .okey{background:var(--teal)}
.acount{text-align:center;margin-top:.65rem;color:#6b7a8d;font-size:.8rem;min-height:1rem}
.action-row{display:flex;gap:.65rem;margin-top:.85rem;align-items:center;flex-wrap:wrap}
.btn-dd{background:rgba(255,179,71,.1);border:1.5px solid rgba(255,179,71,.35);color:#b07800;font-size:.78rem;padding:.4rem .85rem;border-radius:7px;cursor:pointer;font-weight:700;font-family:Inter,sans-serif;min-height:40px}
.btn-dd.on{background:rgba(255,179,71,.22)}.btn-dd:disabled{opacity:.35;cursor:default}
#reveal{display:none;background:var(--surface);color:var(--text);border-radius:14px;padding:1.5rem 1.75rem;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border-soft)}
.rv-q{font-size:.9rem;font-weight:600;color:#6b7a8d;margin-bottom:.85rem;line-height:1.5}
.verdict{font-size:1.5rem;font-weight:900;margin-bottom:.4rem}
.verdict.ok{color:#0a6b5a}.verdict.bad{color:var(--coral)}
.expl{font-size:.83rem;color:#6b7a8d;margin-bottom:1.1rem;line-height:1.6;max-width:480px;margin-left:auto;margin-right:auto}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin-bottom:.85rem;text-align:left}
.bwrap{background:rgba(15,28,46,.05);border-radius:8px;padding:.6rem;border:1px solid rgba(15,28,46,.08)}
.bwrap.right{border-color:rgba(0,201,167,.5);background:rgba(0,201,167,.06)}
.blbl{display:flex;justify-content:space-between;font-size:.73rem;font-weight:700;margin-bottom:.3rem;color:#4a6070}
.bwrap.right .blbl{color:#0a6b5a}
.bbg{height:5px;background:rgba(15,28,46,.08);border-radius:3px}
.bfill{height:5px;border-radius:3px;background:rgba(15,28,46,.15);transition:width .55s ease}
.bfill.right{background:var(--teal)}
.next-banner{background:rgba(15,28,46,.08);border-radius:8px;padding:.55rem 1rem;font-size:.82rem;color:#6b7a8d;margin-bottom:.85rem;text-align:center}
.next-n{font-weight:800;color:var(--coral)}
.reactions{display:flex;gap:.45rem;justify-content:center;flex-wrap:wrap}
.rbtn{background:#fff;border:1.5px solid #dde3ea;border-radius:8px;padding:.4rem .85rem;cursor:pointer;font-size:.8rem;font-weight:700;color:#4a6070;min-height:40px;font-family:Inter,sans-serif}
.rbtn:hover{border-color:var(--coral);color:var(--coral)}
.toast{position:fixed;bottom:1.75rem;left:50%;transform:translateX(-50%);background:var(--coral);color:#fff;padding:.5rem 1.3rem;border-radius:8px;font-weight:800;font-size:.85rem;z-index:999;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.toast.show{opacity:1}
.rfeed{position:fixed;top:60px;right:.85rem;display:flex;flex-direction:column;gap:.3rem;z-index:100;pointer-events:none}
.rpop{background:rgba(22,40,64,.95);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:.3rem .7rem;font-size:.77rem;white-space:nowrap;animation:popIn .2s ease,fadeOut 2.8s 1s forwards}
@keyframes popIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@media(max-width:560px){.side{width:120px}.opts{grid-template-columns:1fr}.qtext{font-size:1rem}.okey{display:none}}
/* All-time leaderboard sidebar section */
.side-sep{height:1px;background:rgba(255,255,255,.06);margin:.25rem 0}
.side-head-alb{padding:.65rem 1rem;font-size:.65rem;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:1px;flex-shrink:0}
.alb-row{display:flex;align-items:center;gap:.4rem;padding:.4rem .7rem;border-bottom:1px solid rgba(255,255,255,.04);font-size:.7rem}
.alb-rank{width:1.25rem;text-align:center;font-weight:800;color:var(--dim);flex-shrink:0}
.alb-rank.top{color:var(--amber)}
.alb-name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alb-name.me{color:var(--teal)}
.alb-pts{color:var(--teal);font-weight:700;flex-shrink:0}
/* Lifetime score in bar */
.mylifetime{font-size:.72rem;color:var(--amber);font-weight:700;display:none}
/* Profile name in bar (generated name) */
.myname{font-size:.72rem;color:var(--dim);font-weight:600;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="bar">
  <div class="logo">🎪 Trivia<em> Circus</em></div>
  <div class="bar-identity">
    <div id="myname" style="font-size:clamp(1.75rem,5vw,3rem);font-weight:900;line-height:1;letter-spacing:-.03em;color:var(--text);max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" aria-label="Your circus name"></div>
    <div style="font-size:.7rem;color:var(--text-muted);font-weight:600;margin-top:.1rem">
      <span id="myscore" aria-label="This game score">0 pts this game</span>
      <span style="margin:0 .35rem">·</span>
      <span id="mylifetime" style="color:var(--teal)" aria-label="All-time score" aria-live="polite"></span>
    </div>
  </div>
  <div class="qctr" id="qctr">Live</div>
</div>
<div class="layout">
  <aside class="side">
    <div class="side-head">In the Ring</div>
    <div class="plist" id="plist" role="list"></div>
    <div class="side-sep" aria-hidden="true"></div>
    <div class="side-head-alb">All-Time</div>
    <div id="alb" role="list" aria-label="All-time leaderboard"></div>
  </aside>
  <main class="main">
    <div class="announce" id="announce" role="status" aria-live="assertive"></div>
    <section class="panel" id="idle">
      <div class="big-e">&#127914;</div>
      <h2>The Circus is Resting</h2>
      <p>You are the first one in. The show starts in a moment.</p>
    </section>
    <section class="panel" id="question" aria-live="polite">
      <div class="qmeta">
        <span class="qcat" id="qcat">Category</span>
        <div class="twrap">
          <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
            <circle cx="22" cy="22" r="18" fill="none" stroke="rgba(15,28,46,.12)" stroke-width="3.5"/>
            <circle id="tcirc" cx="22" cy="22" r="18" fill="none" stroke="var(--coral)" stroke-width="3.5" stroke-dasharray="113.1" stroke-dashoffset="0" stroke-linecap="round"/>
          </svg>
          <div class="tnum" id="tnum">20</div>
        </div>
      </div>
      <div class="qtext" id="qtext"></div>
      <div class="opts" id="opts" role="group"></div>
      <div class="acount" id="acount" role="status" aria-live="polite"></div>
      <div class="action-row">
        <button class="btn-dd" id="ddbtn" onclick="doubleDown()">Double Down +-50pts</button>
        <span style="font-size:.7rem;color:#8a9bb0">1-4 or A-D to answer</span>
      </div>
    </section>
    <section class="panel" id="reveal" aria-live="polite">
      <div class="rv-q" id="rvq"></div>
      <div class="verdict" id="verdict" role="status"></div>
      <div class="expl" id="expl"></div>
      <div class="bars" id="bars"></div>
      <div class="next-banner">Next question in <span class="next-n" id="nextn">5</span>s</div>
      <div class="reactions">
        <button class="rbtn" onclick="react('Knew It')">Knew It</button>
        <button class="rbtn" onclick="react('Lucky Guess')">Lucky Guess</button>
        <button class="rbtn" onclick="react('No Way')">No Way</button>
        <button class="rbtn" onclick="react('Rematch')">Rematch</button>
      </div>
    </section>
  </main>
</div>
    <section class="panel" id="syg" style="display:none;text-align:center">
      <div style="font-size:1.1rem;font-weight:800;margin-bottom:.5rem">The room is divided.</div>
      <div style="color:var(--dim);margin-bottom:1rem;font-size:.9rem">Stand your ground or pick a different answer?</div>
      <div style="display:flex;gap:.75rem;justify-content:center;margin-bottom:.75rem">
        <button id="syg-stay" class="rbtn" style="border-color:var(--teal);color:var(--teal)" onclick="chooseStand('stay')">Stand Ground</button>
        <button id="syg-switch-btn" class="rbtn" style="border-color:var(--amber);color:var(--amber)" onclick="showSwitchChoices()">Switch Answer</button>
      </div>
      <div id="syg-panel" style="display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap"></div>
    </section>
<div class="rfeed" id="rfeed"></div>
<div class="toast" id="tst"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
var NAME=''; // Identity comes from cookie profile (circus_profile event), not URL
var socket=io({transports:['websocket','polling']});
var myChoice=null,timerInt=null,nextInt=null,qStart=0,curQ=null;
function G(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function show(id){['idle','question','reveal','syg'].forEach(function(p){G(p).style.display=p===id?'block':'none'})}
function toast(m,ms){var t=G('tst');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},ms||2200)}
function announce(m,ms){var a=G('announce');a.textContent=m;a.classList.add('show');setTimeout(function(){a.classList.remove('show')},ms||3000)}
socket.emit('join',{}); // identity from cookie, not client-supplied name
socket.on('joined',function(d){
  NAME=d.name||NAME;updateP(d.presence||[]);
  if(d.profile && d.profile.name){ NAME=d.profile.name; var ne=G('myname'); if(ne)ne.textContent=NAME; }
  if(d.phase==='question'&&d.currentQuestion){loadQ(d.currentQuestion,d.currentQuestion.timeRemaining)}else show('idle');
});
socket.on('presence',function(d){updateP(d.players||[])});
socket.on('circus_idle',function(){show('idle')});
function updateP(pl){
  var list = G('plist');
  list.innerHTML = '';  // clear existing — player names never go into innerHTML template strings
  pl.forEach(function(p){
    var row = document.createElement('div');
    row.className = 'prow' + (p.name === NAME ? ' me' : '');
    row.setAttribute('role','listitem');
    // Avatar — first character of name, safe via textContent
    var av = document.createElement('div'); av.className = 'pav';
    av.textContent = p.name.charAt(0).toUpperCase();  // single char, always safe
    // Info
    var info = document.createElement('div'); info.className = 'pinfo';
    var nameEl = document.createElement('div'); nameEl.className = 'pname';
    nameEl.textContent = p.name;  // textContent — XSS-safe
    var scoreEl = document.createElement('div'); scoreEl.className = 'pscore';
    scoreEl.textContent = (p.score||0) + 'pts';
    info.appendChild(nameEl); info.appendChild(scoreEl);
    // Dot
    var dot = document.createElement('div');
    dot.className = 'pdot' + (p.answered ? ' on' : '');
    row.appendChild(av); row.appendChild(info); row.appendChild(dot);
    list.appendChild(row);
  });
  var me = pl.find(function(p){return p.name === NAME});
  if(me) G('myscore').textContent = (me.score||0)+' pts this game';
}
socket.on('question',function(q){loadQ(q,q.timeMs);if(q.presence)updateP(q.presence);G('qctr').textContent='Q#'+((q.index||0)+1);clearInterval(nextInt)});
function loadQ(q,timeMs){
  curQ=q;myChoice=null;qStart=Date.now();
  G('qcat').textContent=q.category||'';
  G('qtext').textContent=q.text||'';
  G('acount').textContent='';
  // Reset SYG panel for fresh question
  var sp=G('syg-panel');if(sp)sp.innerHTML='';
  var ssb=G('syg-switch-btn');if(ssb){ssb.style.display='';ssb.disabled=false;}
  var ss=G('syg-stay');if(ss)ss.disabled=false;
  var db=G('ddbtn');db.disabled=false;db.classList.remove('on');db.textContent='Double Down +-50pts';
  // Build options safely — DOM construction, no innerHTML interpolation
  var optsEl = G('opts');
  optsEl.innerHTML = '';
  optsEl.onclick = null;
  ['A','B','C','D'].forEach(function(k) {
    var btn = document.createElement('button');
    btn.className = 'opt';
    btn.id = 'o' + k;  // k is always A/B/C/D — fixed set
    btn.dataset.k = k;
    btn.setAttribute('aria-label', k + ': ' + (q.options[k] || ''));
    var keySpan = document.createElement('span');
    keySpan.className = 'okey';
    keySpan.textContent = k;
    var txtSpan = document.createElement('span');
    txtSpan.textContent = q.options[k] || '';
    btn.appendChild(keySpan);
    btn.appendChild(txtSpan);
    optsEl.appendChild(btn);
  });
  optsEl.onclick = function(e) {
    var btn = e.target.closest('.opt');
    if (btn && btn.dataset.k) pick(btn.dataset.k);
  };
  show('question');startTimer(Math.round((timeMs||22000)/1000));
}
function startTimer(s){
  clearInterval(timerInt);
  var circ=G('tcirc'),tot=s,full=113.1;
  function tick(){G('tnum').textContent=s;circ.style.strokeDashoffset=full*(1-s/tot);circ.style.stroke=s<=5?'var(--amber)':s<=10?'var(--coral)':'var(--teal)';if(s<=0){clearInterval(timerInt);return}s--}
  tick();timerInt=setInterval(tick,1000);
}
function pick(k){
  if(myChoice)return;myChoice=k;
  var ms=Date.now()-qStart;
  document.querySelectorAll('.opt').forEach(function(b){b.disabled=true});
  G('o'+k).classList.add('sel');
  socket.emit('submit_answer',{choice:k,timeMs:ms});
  clearInterval(timerInt);toast(ms<=7000?'Speed answer!':'Locked in');
}
function doubleDown(){var b=G('ddbtn');if(b.disabled||b.classList.contains('on'))return;socket.emit('double_down');b.classList.add('on');b.textContent='Doubled Down!';toast('All in!')}
document.addEventListener('keydown',function(e){
  if(G('question').style.display==='none')return;
  var m={'1':'A','2':'B','3':'C','4':'D','a':'A','b':'B','c':'C','d':'D'};
  var k=m[e.key.toLowerCase()];if(k)pick(k);
});
socket.on('answer_result',function(d){toast(d.correct?'Correct! +'+d.earned+'pts':'Wrong answer',3000)});
socket.on('reveal',function(d){
  clearInterval(timerInt);
  G('rvq').textContent=curQ?curQ.text:'';
  var ok=myChoice===d.answer;
  G('verdict').textContent=myChoice?(ok?'Correct!':'Wrong - answer: '+d.answer):'Out of time';
  G('verdict').className='verdict '+(ok?'ok':'bad');
  G('expl').textContent=d.explanation||'';
  ['A','B','C','D'].forEach(function(k){var b=G('o'+k);if(!b)return;b.classList.remove('sel');if(k===d.answer)b.classList.add('ok');else if(k===myChoice)b.classList.add('bad')});
  var barsEl = G('bars');
  barsEl.innerHTML = '';
  ['A','B','C','D'].forEach(function(k){
    var r = k === d.answer;
    var wrap = document.createElement('div'); wrap.className = 'bwrap' + (r?' right':'');
    var lbl = document.createElement('div'); lbl.className = 'blbl';
    var lspan = document.createElement('span');
    lspan.textContent = k + '. ' + ((curQ&&curQ.options&&curQ.options[k])||'');
    var rspan = document.createElement('span');
    rspan.textContent = (d.pct[k]||0) + '%';
    lbl.appendChild(lspan); lbl.appendChild(rspan);
    var bg = document.createElement('div'); bg.className = 'bbg';
    var fill = document.createElement('div');
    fill.className = 'bfill' + (r?' right':'');
    fill.style.width = (d.pct[k]||0) + '%';
    bg.appendChild(fill); wrap.appendChild(lbl); wrap.appendChild(bg);
    barsEl.appendChild(wrap);
  });
  if(d.isUnanimous)announce('Unanimous! The whole circus got it right!',3500);
  if(d.leaderboard)updateP(d.leaderboard);
  var n=5;G('nextn').textContent=n;clearInterval(nextInt);
  nextInt=setInterval(function(){n--;G('nextn').textContent=n;if(n<=0)clearInterval(nextInt)},1000);
  show('reveal');
});
socket.on('answer_count',function(d){
  if(d&&typeof d.count==='number') G('acount').textContent=d.count+' / '+d.total+' answered';
});
socket.on('stand_your_ground',function(d){
  show('syg');
});
socket.on('syg_locked',function(){
  disableSYG();
});
function broadcast_syg_panel(){
  // Only show SYG panel if in reveal state; otherwise ignore
  if(G('reveal')&&G('reveal').style.display!=='none'){
    var panel=G('syg-panel');
    if(panel)panel.style.display='block';
  }
}
function showSwitchChoices(){
  // Show explicit per-choice buttons — do NOT emit yet (TC blocker #10)
  var panel=G('syg-panel');
  panel.innerHTML='';
  ['A','B','C','D'].filter(function(k){return k!==myChoice}).forEach(function(k){
    var btn=document.createElement('button');
    btn.className='rbtn';
    btn.dataset.choice=k;
    btn.style.cssText='border-color:var(--amber);color:var(--amber)';
    btn.textContent=k+(curQ&&curQ.options&&curQ.options[k]?': '+curQ.options[k]:'');
    btn.onclick=function(){
      myChoice=k;
      socket.emit('stand_ground',{choice:k});
      disableSYG();
    };
    panel.appendChild(btn);
  });
  G('syg-switch-btn').style.display='none';
}
function disableSYG(){
  ['syg-stay','syg-switch-btn'].forEach(function(id){var b=G(id);if(b)b.disabled=true;});
  [...G('syg-panel').querySelectorAll('button')].forEach(function(b){b.disabled=true;});
}
function chooseStand(decision){
  if(decision==='stay'){
    socket.emit('stand_ground',{decision:'stay'});
    disableSYG();
  } else {
    showSwitchChoices();
  }
}
// ── Persistent profile + all-time leaderboard ──────────────────────────────
var myLifetimeScore = 0;
function updateAllTimeBoard(board) {
  var el = G('alb');
  el.innerHTML = '';
  if (!board || !board.length) return;
  board.forEach(function(p) {
    var row = document.createElement('div');
    row.className = 'alb-row';
    row.setAttribute('role','listitem');
    var rank = document.createElement('span');
    rank.className = 'alb-rank' + (p.rank <= 3 ? ' top' : '');
    rank.textContent = p.rank;
    var name = document.createElement('span');
    // isYou flag from server — no UUID exposed
    name.className = 'alb-name' + (p.isYou ? ' me' : '');
    name.textContent = p.name || '?';
    var pts = document.createElement('span');
    pts.className = 'alb-pts';
    pts.textContent = (p.score || 0).toLocaleString() + ' pts';
    row.appendChild(rank); row.appendChild(name); row.appendChild(pts);
    el.appendChild(row);
  });
}
socket.on('circus_profile', function(p) {
  if (!p) return;
  // No UUID from server — identify by isYou flag and name
  myLifetimeScore = p.lifetimeScore || 0;
  NAME = p.name || NAME;
  var nameEl = G('myname');
  if (nameEl) nameEl.textContent = NAME;
  var lifEl = G('mylifetime');
  if (lifEl) lifEl.textContent = myLifetimeScore > 0 ? myLifetimeScore.toLocaleString()+' pts all-time' : 'Unranked';
});
socket.on('circus_leaderboard', function(d) {
  var entries = d && (d.entries || d.leaderboard);
  if (entries) {
    updateAllTimeBoard(entries);
    // Refresh lifetime score using isYou flag (no UUID lookup)
    var me = entries.find(function(p) { return p.isYou; });
    if (me) {
      myLifetimeScore = me.score || 0;
      var lifEl = G('mylifetime');
      if (lifEl) lifEl.textContent = myLifetimeScore > 0 ? myLifetimeScore.toLocaleString()+' pts all-time' : 'Unranked';
    }
  }
});
function react(e){socket.emit('reaction',{emoji:e});toast(e)}
socket.on('reaction',function(d){
  if(!d||typeof d.name!=='string'||typeof d.emoji!=='string') return;
  var feed=G('rfeed'),el=document.createElement('div');
  el.className='rpop';
  el.textContent = d.name + ': ' + d.emoji;  // textContent — both safe
  feed.appendChild(el);setTimeout(function(){if(el&&el.parentNode)el.remove()},3800);
});
show('idle');
</script>
</body>
