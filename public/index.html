<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trivia Circus — The Show Never Stops</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0f1c2e;--ivory:#faf6f0;--coral:#ff5252;--coral2:#e04444;--teal:#00c9a7;--amber:#ffb347;--white:#f0f4f8;--dim:#7a9bb5}
body{background:var(--navy);color:var(--white);font-family:Inter,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem}
.wrap{width:100%;max-width:400px;text-align:center}
.logo{font-size:3rem;margin-bottom:.5rem}
h1{font-size:2rem;font-weight:900;letter-spacing:-1px;margin-bottom:.4rem}
h1 span{color:var(--coral)}
.tag{color:var(--dim);font-size:.95rem;margin-bottom:2rem;line-height:1.6}
.live-count{background:rgba(0,201,167,.1);border:1px solid rgba(0,201,167,.25);border-radius:999px;color:var(--teal);font-size:.78rem;font-weight:700;padding:.3rem .85rem;margin-bottom:2rem;display:inline-block}
.card{background:var(--ivory);border-radius:16px;padding:2rem;color:#1a2a3a;box-shadow:0 20px 56px rgba(0,0,0,.4)}
.card h2{font-size:1.1rem;font-weight:800;margin-bottom:1.25rem}
label{display:block;font-size:.72rem;font-weight:700;color:#6b7a8d;margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.5px;text-align:left}
input{width:100%;background:#fff;border:2px solid #dde3ea;border-radius:8px;padding:.75rem 1rem;font-size:1rem;font-family:Inter,sans-serif;color:#1a2a3a;outline:none;transition:border-color .18s;margin-bottom:1rem}
input:focus{border-color:var(--coral)}
input::placeholder{color:#aab5c0}
.btn{display:block;width:100%;padding:.9rem;border-radius:9px;border:none;font-size:1rem;font-weight:800;cursor:pointer;font-family:Inter,sans-serif;background:var(--coral);color:#fff;transition:all .18s;min-height:52px}
.btn:hover{background:var(--coral2);transform:translateY(-1px);box-shadow:0 8px 24px rgba(255,82,82,.3)}
.btn:focus-visible{outline:2px solid var(--coral);outline-offset:3px}
.err{color:var(--coral);font-size:.82rem;margin-top:.5rem;min-height:1.1rem;text-align:center}
.hint{font-size:.75rem;color:#8a9bb0;margin-top:.75rem}
.cats{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem;margin-top:2rem}
.cat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--dim);font-size:.72rem;padding:.25rem .7rem;border-radius:999px}
footer{color:var(--dim);font-size:.75rem;margin-top:2.5rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🎪</div>
  <h1>Trivia <span>Circus</span></h1>
  <p class="tag">The show never stops.<br>Walk in. Answer. Earn your title.</p>
  <div class="live-count" id="live-count">🟢 Loading...</div>
  <div class="card">
    <h2>Pick your name and step in</h2>
    <label for="pname">Your Pseudonym</label>
    <input id="pname" type="text" placeholder="CosmicOracle" maxlength="24" autocomplete="off">
    <button class="btn" onclick="enter()" aria-label="Enter Trivia Circus">Enter the Ring 🎪</button>
    <div class="err" id="err"></div>
    <p class="hint">No account needed. Leave anytime.</p>
  </div>
  <div class="cats">
    <span class="cat">📜 History</span>
    <span class="cat">🔬 Science</span>
    <span class="cat">🌍 Geography</span>
    <span class="cat">🎭 Culture</span>
    <span class="cat">🏆 Sports</span>
    <span class="cat">🃏 Wild Card</span>
  </div>
  <footer>Trivia Circus — Questions for people who actually know things.</footer>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
// Show live count via quick socket peek
var sc = io({transports:['websocket','polling']});
sc.on('presence', function(d){
  document.getElementById('live-count').textContent = (d.players && d.players.length > 0)
    ? '🟢 ' + d.players.length + ' player' + (d.players.length===1?'':'s') + ' in the ring now'
    : '⭕ Circus is quiet — be the first in';
});
sc.emit('peek'); // lightweight presence peek

function err(m){var e=document.getElementById('err');e.textContent=m;setTimeout(function(){e.textContent=''},3000)}
function enter(){
  var n=document.getElementById('pname').value.trim();
  if(!n){err('Enter a name first');document.getElementById('pname').focus();return}
  window.location.href='game.html?name='+encodeURIComponent(n);
}
document.addEventListener('keydown',function(e){if(e.key==='Enter')enter()});
</script>
</body>
</html>
